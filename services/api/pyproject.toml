[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[project]
name = "riyaaz-api"
version = "0.1.0"
description = "RIYAAZ backend API"
requires-python = ">=3.13"
dependencies = [
  "fastapi==0.118.0",
  "uvicorn[standard]==0.37.0"
]

[dependency-groups]
dev = [
  "httpx==0.28.1",
  "pytest==8.4.2"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.hatch.build.targets.wheel]
packages = ["src/riyaaz_api"]
