[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[project]
name = "riyaaz-api"
version = "0.1.0"
description = "RIYAAZ backend API"
requires-python = ">=3.13"
dependencies = [
  "fastapi==0.118.0",
  "uvicorn[standard]==0.37.0",
  "pydantic-settings>=2.9.0,<3.0.0",
  "sqlalchemy[asyncio]>=2.0.41,<2.1.0",
  "asyncpg>=0.30.0,<1.0.0",
  "alembic>=1.16.0,<2.0.0",
  "structlog>=25.1.0,<26.0.0",
]

[dependency-groups]
dev = [
  "httpx==0.28.1",
  "pytest==8.4.2",
  "pytest-asyncio>=1.0.0,<2.0.0",
  "ruff>=0.12.0,<1.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# B008: Depends() in default args is the standard FastAPI DI pattern.
"**/presentation/routes.py" = ["B008"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.hatch.build.targets.wheel]
packages = ["src/riyaaz_api"]
